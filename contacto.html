<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Clothes Brand</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>CLOTHES BRAND</h1>
        <p>Registrate y realiza tu pedido</p>

        <button class="menu-toggle" type="button" aria-label="Abrir menú" aria-expanded="false" aria-controls="menu-principal">
            ☰
        </button>
        <nav id="menu-principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productos.html">Productos</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section class="formulario">
            <h2>Registro de usuario</h2>
            <p>Completa tus datos para crear una cuenta.</p>

            <form id="form-contacto" novalidate>

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre"
                placeholder="Escribe tu nombre" required>

                <label for="apellido">Apellidos:</label>
                <input type="text" id="apellido" name="apellido"
                placeholder="Escribe tus apellidos" required>

                <label for="correo">Correo electronico:</label>
                <input type="email" id="correo" name="correo"
                placeholder="ejemplo@gmail.com" required>

                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena"
                minlength="6" required>

                <label for="telefono">Numero de telefono:</label>
                <input type="tel" id="telefono" name="telefono"
                placeholder="Tu numero de telefono" required>

                <h2>Datos del pedido</h2>

                <label for="producto">Selecciona un producto:</label>
                <select id="producto" name="producto" required>
                    <option value="">Selecciona una opcion</option>
                    <option value="Playera">Playera basica</option>
                    <option value="Sudadera">Sudadera</option>
                    <option value="Pantalon">Pantalon</option>
                    <option value="Gorra">Gorra</option>
                </select>

                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" name="cantidad"
                min="1" max="20" required>

                <label for="direccion">Direccion de entrega:</label>
                <input type="text" id="direccion" name="direccion"
                placeholder="Calle y numero de casa" required>

                <label for="ciudad">Ciudad:</label>
                <input type="text" id="ciudad" name="ciudad" required>

                <label for="pago">Forma de pago:</label>
                <select id="pago" name="pago" required>
                    <option value="">Selecciona una opcion</option>
                    <option value="Tarjeta">Tarjeta</option>
                    <option value="Transferencia">Transferencia</option>
                    <option value="Contra entrega">Contra entrega</option>
                </select>

                <label for="comentarios">Comentarios adicionales:</label>
                <textarea id="comentarios" name="comentarios"
                rows="4" placeholder="Escribe algun comentario..."></textarea>

                <p id="mensaje-formulario" class="mensaje-formulario" role="status" aria-live="polite"></p>
                <button type="submit">Enviar registro y pedido</button>

            </form>
        </section>

    </main>

    <footer>
        <p>Clothes Brand - Marca mexicana</p>
        <p>Todos los derechos reservados 2026</p>
    </footer>

    <script src="main.js" defer></script>
</body>
</html>
